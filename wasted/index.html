<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wasted — Set up</title>
  <meta name="description" content="Tell us where you live. We never keep your pictures.">
  <link rel="icon" href="../design-system/Wasted_Icon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap-grid.min.css"
    integrity="sha384-VIeCCV0aVHr99fkXDSmzLRuJhJWQXe4bDXs6hgg6w6zOTbtAWr8RqSNWu4a2ef9p" crossorigin="anonymous">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="css/wasted.css">
</head>

<body>
  <a class="w-skip" href="#main">Skip to content</a>

  <div class="container">
    <div class="row g-3 g-lg-4 align-items-stretch" style="padding:24px 0">

      <div class="col-12 col-lg-5">
        <div class="w-hero">
          <img class="w-hero__logo" src="../design-system/Wasted_Logo_Inverse.svg" alt="Wasted">
          <h1 class="w-hero__slogan">throw it right</h1>
        </div>
      </div>

      <main class="col-12 col-lg-7" id="main">
        <form class="row g-3" action="scan.html" method="get">

          <div class="col-12 col-md-6">
            <div class="w-tile">
              <div class="w-tile__head"><svg class="w-i w-i--lg" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg><h2>Your city</h2></div>
              <label class="w-sr" for="locality">Your city</label>
              <select class="w-select" id="locality" name="locality">
                <option value="gdl" selected>Guadalajara</option>
                <option value="zap">Zapopan</option>
                <option value="" disabled>More cities soon</option>
              </select>
            </div>
          </div>

          <div class="col-12 col-md-6">
            <div class="w-tile">
              <div class="w-tile__head"><svg class="w-i w-i--lg" aria-hidden="true" focusable="false"><use href="#i-shield"/></svg><h2>Permissions</h2></div>
              <div class="w-switch"><svg class="w-i" aria-hidden="true" focusable="false"><use href="#i-camera"/></svg><label class="w-switch__name" for="perm-camera">Camera</label>
                <input class="w-switch__input" type="checkbox" id="perm-camera" name="perm-camera" checked></div>
              <div class="w-switch"><svg class="w-i" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg><label class="w-switch__name" for="perm-location">Location</label>
                <input class="w-switch__input" type="checkbox" id="perm-location" name="perm-location" checked></div>
            </div>
          </div>

          <div class="col-12">
            <div class="w-note"><svg class="w-i" aria-hidden="true" focusable="false"><use href="#i-info"/></svg><p>We never keep your pictures. We look at them and let them go.</p></div>
          </div>

          <div class="col-12">
            <button class="w-btn w-btn--block" type="submit">Start <svg class="w-i" aria-hidden="true" focusable="false"><use href="#i-arrow"/></svg></button>
          </div>

        </form>
      </main>

    </div>
  </div>

  <!-- Reusable component: icon sprite. Inlined rather than loaded from a
       file so the stroke icons can inherit the surface colour. Identical
       block on every screen. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M12 4v16"/><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/><path d="M9 20h6"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
    <symbol id="i-droplet" viewBox="0 0 24 24"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="12" r="10"/></symbol>
    <symbol id="i-crush" viewBox="0 0 24 24"><path d="M12 22v-6"/><path d="M12 8V2"/><path d="M4 12H2"/><path d="M10 12H8"/><path d="M16 12h-2"/><path d="M22 12h-2"/><path d="m15 19-3-3-3 3"/><path d="m15 5-3 3-3-3"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="1"/><path d="M18.944 12.33a1 1 0 0 0 0-.66 7.5 7.5 0 0 0-13.888 0 1 1 0 0 0 0 .66 7.5 7.5 0 0 0 13.888 0"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"/><rect x="3" y="7" width="18" height="4" rx="1"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></symbol>
  </svg>

  <!-- Reusable component: bottom navigation. Two secondary modules in the
       pill, the only real action as the sphere on the right. Identical block on
       every screen; only aria-current moves. -->
  <nav class="w-nav" aria-label="Main">
    <ul class="w-nav__pill">
      <li>
        <a class="w-nav__item" href="profile.html" aria-label="Profile">
          <svg class="w-i" aria-hidden="true" focusable="false"><use href="#i-user"/></svg>
          <span aria-hidden="true">Profile</span>
        </a>
      </li>
      <li>
        <a class="w-nav__item" href="history.html" aria-label="History">
          <svg class="w-i" aria-hidden="true" focusable="false"><use href="#i-history"/></svg>
          <span aria-hidden="true">History</span>
        </a>
      </li>
    </ul>
    <a class="w-nav__fab" href="scan.html" aria-label="Scan">
      <svg class="w-i" aria-hidden="true" focusable="false"><use href="#i-camera"/></svg>
    </a>
  </nav>

</body>

</html>
